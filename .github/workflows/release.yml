name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS (Intel)
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - name: Linux (x86_64)
            platform: ubuntu-22.04
            args: ''
          - name: Windows (x86_64)
            platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The release tag is the single source of truth for the version: inject it
      # into tauri.conf.json (overrides Cargo.toml for bundle names, the updater,
      # and app.getVersion()). The version fields committed on main are only used
      # by local dev builds.
      - name: Set version from tag
        shell: bash
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a vX.Y.Z release tag" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          '
          echo "Building nettle $VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # macOS code signing + notarization: the tauri CLI treats even an EMPTY
      # APPLE_CERTIFICATE env var as "signing configured", so only export the
      # variables when the secrets actually exist. See README "Signing macOS builds".
      - name: Enable macOS signing when secrets are configured
        if: matrix.platform == 'macos-latest'
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            {
              echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
              echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
              echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
            echo "macOS signing enabled"
          else
            echo "APPLE_CERTIFICATE secret not set — building unsigned"
          fi

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'nettle ${{ github.ref_name }}'
          releaseBody: |
            Resilient SSH client with live port discovery, pinned tunnels,
            dual-pane SFTP, and a built-in terminal.

            Downloads below: `.dmg` (macOS), `.AppImage`/`.deb`/`.rpm` (Linux),
            `.msi`/`.exe` (Windows). Builds are unsigned — see the README for
            platform notes on first launch.
          # Published by the publish job once every platform is uploaded, so
          # releases/latest never points at a release without its assets.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest

  homebrew:
    name: Update Homebrew cask and Scoop bucket
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: token
        run: echo "have=${{ secrets.HOMEBREW_TAP_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.token.outputs.have == 'true'

      - name: Checkout tap
        if: steps.token.outputs.have == 'true'
        uses: actions/checkout@v7
        with:
          repository: gitu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # Renders packaging/*.tmpl into the tap: Casks/nettle.rb (macOS + Linux
      # via Homebrew) and bucket/nettle.json (Windows via Scoop).
      - name: Render cask and Scoop manifest
        if: steps.token.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # not "assets": that directory already exists in the repo (screenshots)
          mkdir release-files
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            -D release-files -p '*.dmg' -p '*.AppImage' -p '*.msi'
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          mkdir -p tap/Casks tap/bucket
          render() {
            sed \
              -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHA_MAC_ARM@/$(sum release-files/nettle_${VERSION}_aarch64.dmg)/" \
              -e "s/@SHA_MAC_INTEL@/$(sum release-files/nettle_${VERSION}_x64.dmg)/" \
              -e "s/@SHA_LINUX@/$(sum release-files/nettle_${VERSION}_amd64.AppImage)/" \
              -e "s/@SHA_WIN@/$(sum release-files/nettle_${VERSION}_x64_en-US.msi)/" \
              "$1"
          }
          render packaging/nettle.rb.tmpl > tap/Casks/nettle.rb
          render packaging/nettle.json.tmpl > tap/bucket/nettle.json

      - name: Commit tap
        if: steps.token.outputs.have == 'true'
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/nettle.rb bucket/nettle.json
          git diff --cached --quiet || git commit -m "nettle ${GITHUB_REF_NAME#v}"
          git push
